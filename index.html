           text:"La TAE repose sur la théorie de l'attachement (John Bowlby) et la psychologie humaniste (Carl Rogers). Leslie Greenberg a intégré ces apports avec les connaissances sur l'affect pour créer la Thérapie Axée sur l'Émotion moderne.",
           detail:"La Thérapie Axée sur les Émotions puise ses fondements dans deux courants théoriques majeurs de la psychologie du XXe siècle : la théorie de l'attachement de John Bowlby, qui éclaire comment les liens précoces façonnent nos relations adultes, et la psychologie humaniste de Carl Rogers, centrée sur l'authenticité et l'acceptation inconditionnelle. Leslie Greenberg a intégré ces deux héritages avec les connaissances scientifiques contemporaines sur les émotions (leur fonction, leur traitement neurologique) pour créer la Thérapie Axée sur l'Émotion moderne, une approche structurée qui place le travail émotionnel au cœur du processus thérapeutique."},
          {q:"Quelle est la différence entre émotions primaires et émotions secondaires selon la TAE ?",
           title:"Émotions primaires et secondaires",
           text:"Les émotions primaires sont des réactions directes et instinctives reflétant nos besoins fondamentaux. Les émotions secondaires sont des réponses plus complexes, souvent des réactions aux émotions primaires elles-mêmes.",
           detail:"Les émotions primaires constituent des réactions directes, immédiates et instinctives à une situation, reflétant fidèlement nos besoins fondamentaux (la peur signale un danger, la tristesse signale une perte). Les émotions secondaires, en revanche, sont des réponses plus complexes et souvent apprises, qui viennent réagir à l'émotion primaire elle-même plutôt qu'à la situation initiale — par exemple, ressentir de la colère (émotion secondaire) pour masquer une peur ou une tristesse plus vulnérable (émotion primaire) que l'on n'ose pas montrer. Distinguer ces deux niveaux est essentiel en TAE pour accéder au véritable besoin sous-jacent."},
          {q:"Quel est le principe de la « transformation émotionnelle » en TAE, par opposition à la suppression des émotions difficiles ?",

           text:"Plutôt que de supprimer ou éviter les émotions difficiles, la TAE encourage leur exploration sûre et constructive, favorisant croissance personnelle et guérison.",
           detail:"Contrairement à des stratégies d'évitement ou de suppression qui chercheraient à minimiser ou fuir les émotions difficiles, la TAE part du principe que ces émotions, aussi inconfortables soient-elles, portent une information précieuse sur nos besoins profonds. La transformation émotionnelle consiste donc à créer un espace thérapeutique suffisamment sécurisant pour explorer pleinement et consciemment ces émotions difficiles, plutôt que de les fuir, ce processus d'exploration authentique favorisant à terme une véritable croissance personnelle et une guérison durable, contrairement à l'évitement qui ne fait généralement que reporter ou aggraver la difficulté."},

           detail:"S'appuyant directement sur la théorie de Bowlby, la TAE reconnaît que les styles d'attachement développés durant l'enfance (sécure, anxieux, évitant, désorganisé), en fonction de la qualité des relations avec les figures parentales, continuent d'influencer profondément la manière dont un individu vit ses relations intimes à l'âge adulte, y compris sur le plan sexuel. La TAE aide le client à explorer consciemment comment ces empreintes précoces façonnent aujourd'hui encore ses comportements relationnels (besoin excessif de réassurance, peur de l'intimité, difficulté à faire confiance) et ses réponses émotionnelles dans le contexte de sa sexualité actuelle."},
          {q:"Comment les émotions négatives et positives influencent-elles respectivement la sexualité, selon la TAE ?",

           text:"Les émotions négatives (honte, peur, anxiété) peuvent entraîner évitement et difficultés de communication. Les émotions positives (joie, connexion) renforcent le bien-être et l'expérience sexuelle.",
           detail:"Les émotions négatives comme la honte, la peur ou l'anxiété, lorsqu'elles sont associées à la sexualité, tendent à générer des comportements d'évitement des situations intimes ainsi que des difficultés de communication avec le partenaire, créant potentiellement un cercle vicieux d'éloignement progressif. À l'inverse, les émotions positives comme la joie ressentie ou le sentiment de connexion authentique avec l'autre renforcent significativement le bien-être général et la qualité de l'expérience sexuelle vécue. Cette compréhension invite le sexothérapeute à toujours explorer la dimension émotionnelle sous-jacente à toute difficulté sexuelle présentée par un client."}

          {q:"En quoi les méditations guidées focalisées sur le corps (PC1) sont-elles utiles en TAE, notamment pour les clients déconnectés de leur corps ?",

           detail:"Certains clients, notamment ceux ayant vécu des traumatismes ou une éducation particulièrement restrictive concernant le corps, développent une forme de déconnexion corporelle qui les empêche de percevoir clairement leurs propres sensations physiques et, par extension, les émotions qui leur sont associées (les émotions se manifestant toujours, au moins en partie, par des sensations corporelles). Les méditations guidées focalisées sur le corps aident ces clients à progressivement rétablir cette connexion, leur permettant d'accéder plus facilement aux émotions sous-jacentes à leurs difficultés sexuelles, une étape préalable souvent indispensable au travail émotionnel proprement dit."},
          {q:"Comment se déroule l'exercice d'expression des besoins affectifs entre partenaires, et quelles conditions doivent être respectées ?",

          {q:"Quelles émotions plus profondes se cachent souvent derrière l'anxiété de performance, et quelles sont les 4 étapes du travail thérapeutique associé ?",

           detail:"Derrière l'anxiété de performance sexuelle, souvent présentée comme le problème principal par le client, se cachent fréquemment des émotions plus profondes et vulnérables telles que la peur du rejet par le partenaire ou une honte plus ancienne liée à l'image de soi. Le travail thérapeutique en TAE suit alors quatre étapes progressives : l'identification de ces émotions vulnérables sous-jacentes ; l'exploration des expériences passées qui les ont façonnées ; leur expression et transformation dans un cadre thérapeutique sécurisant ; et enfin leur intégration concrète dans la vie sexuelle actuelle du client, permettant une transformation durable plutôt qu'un simple soulagement symptomatique temporaire."}

           detail:"La citation de Freud, invitant chaque individu à commencer par se connaître lui-même, résume l'esprit fondateur de toute la démarche psychodynamique : la connaissance de soi comme préalable à toute transformation psychique. En mettant l'accent sur la sexualité infantile — concept alors révolutionnaire et controversé — et sur le complexe d'Œdipe, Freud a été le premier à explorer systématiquement comment les toutes premières expériences liées à la sexualité, dès l'enfance, laissent une empreinte durable sur la psyché adulte, influençant les comportements, désirs et difficultés sexuelles rencontrées bien plus tard dans la vie."},
          {q:"Quels concepts Carl Jung a-t-il introduits, et en quoi enrichissent-ils la compréhension des conflits d'identité sexuelle et de genre ?",

           detail:"Carl Jung, disciple puis dissident de Freud, a considérablement élargi le champ de la psychodynamique en introduisant l'inconscient collectif (une couche de l'inconscient partagée par toute l'humanité) et les archétypes qui la peuplent. Ses concepts d'anima (la part féminine de l'inconscient masculin) et d'animus (la part masculine de l'inconscient féminin) offrent un cadre précieux pour comprendre et travailler cliniquement les conflits liés au genre et à l'identité sexuelle, en reconnaissant que chaque individu porte en lui, de façon inconsciente, des qualités traditionnellement associées aux deux polarités de genre."},
          {q:"Quel apport Melanie Klein a-t-elle fait à la compréhension des relations sexuelles adultes, à travers ses théories sur les premières interactions affectives ?",
           title:"Melanie Klein",
           text:"A mis en lumière l'importance des premières interactions affectives. Ses théories sur les positions schizoparanoïde et dépressive aident à comprendre comment ces expériences influencent la capacité adulte à établir des relations sexuelles saines.",
           detail:"Melanie Klein a profondément enrichi la psychanalyse en mettant l'accent sur l'importance déterminante des toutes premières interactions affectives entre le nourrisson et sa figure de soin principale, bien avant même l'apparition du langage. Ses concepts de position schizoparanoïde (perception clivée du monde en « tout bon » ou « tout mauvais ») et de position dépressive (capacité progressive à intégrer une vision plus nuancée et ambivalente d'autrui) offrent un cadre précieux pour comprendre comment ces expériences précoces, souvent inconscientes, influencent durablement la capacité adulte à établir des relations sexuelles et affectives équilibrées et matures."},
          {q:"Quels concepts Donald Winnicott a-t-il développés, et comment éclairent-ils l'expression sexuelle et l'identité de genre ?",
           title:"Donald Winnicott",
           text:"A souligné l'importance du vrai self, du faux self, et d'un environnement facilitant — ses théories sur l'espace potentiel éclairent l'expression sexuelle et l'identité de genre.",
           detail:"Donald Winnicott a introduit la distinction cruciale entre le « vrai self » (l'identité authentique de la personne) et le « faux self » (une adaptation défensive développée pour se conformer aux attentes extérieures, souvent au détriment de l'authenticité), ainsi que le concept d'environnement facilitant (un cadre suffisamment sécurisant permettant le développement sain de l'enfant). Sa théorie de l'« espace potentiel » — cet espace intermédiaire entre soi et le monde où se déploient le jeu et la créativité — éclaire particulièrement bien l'expression sexuelle et l'identité de genre, en soulignant l'importance d'un espace sécurisant pour explorer authentiquement ces dimensions de soi."},
          {q:"Quels sont les quatre principes fondamentaux qui structurent l'approche psychodynamique appliquée à la sexualité ?",
           title:"Quatre principes fondamentaux",
           text:"L'importance de l'inconscient (réservoir de désirs et conflits), la résistance (évitement de sujets douloureux), les phénomènes de transfert et contre-transfert, et le rôle des mécanismes de défense.",
           detail:"Le premier principe, l'importance de l'inconscient, considère celui-ci comme un véritable réservoir de désirs et conflits refoulés qui continuent d'influencer le comportement sexuel conscient. Le deuxième, la résistance, désigne les mécanismes par lesquels un patient évite inconsciemment d'aborder des sujets douloureux en thérapie. Le troisième, les phénomènes de transfert et contre-transfert (déjà vus au Module 1), enrichissent la compréhension de la relation thérapeutique elle-même. Le quatrième, les mécanismes de défense (déni, projection, sublimation), éclaire comment le psychisme se protège inconsciemment face à des conflits ou angoisses liés à la sexualité."}

        cards:[
          {q:"Comment la résistance se manifeste-t-elle en sexothérapie, et pourquoi la reconnaître est-il crucial pour progresser ?",
           title:"La résistance en sexothérapie",

          {q:"Quelle est la différence entre transfert et contre-transfert en sexothérapie psychodynamique ?",
           title:"Transfert et contre-transfert",
           text:"Le transfert survient quand le patient projette sur le thérapeute des sentiments habituellement dirigés vers d'autres figures. Le contre-transfert désigne les réactions émotionnelles du thérapeute envers le patient.",
           detail:"Le transfert, déjà abordé au Module 1, désigne le phénomène par lequel le patient projette inconsciemment sur son thérapeute des sentiments, attentes ou schémas relationnels initialement dirigés vers d'autres figures significatives de sa vie (parents, anciens partenaires). Le contre-transfert, phénomène complémentaire et tout aussi important, désigne les réactions émotionnelles que le thérapeute lui-même développe envers son patient, en réponse consciente ou inconsciente à ce qui se joue dans la relation thérapeutique. La reconnaissance et la gestion professionnelle de ces deux phénomènes, souvent intriqués, sont essentielles à la qualité et à l'efficacité du travail thérapeutique."},

           detail:"Julien, âgé de 34 ans, consulte pour une problématique qui le déconcerte lui-même : malgré un désir manifeste et sincère d'avoir des relations intimes durables, il constate qu'il finit systématiquement par saboter inconsciemment ces relations avant qu'elles ne s'approfondissent véritablement. Au fil des séances, il rapporte un rêve récurrent particulièrement marquant : il se trouve piégé dans une toile d'araignée, immobilisé, tandis qu'une figure féminine dont les traits restent indistincts l'observe silencieusement, sans qu'il puisse déterminer si son regard est bienveillant ou menaçant."},
          {q:"Comment la thérapeute a-t-elle interprété les symboles du rêve de Julien (toile d'araignée, figure féminine) ?",

           detail:"Grâce à un travail progressif d'analyse guidée du rêve, la thérapeute a aidé Julien à explorer la signification symbolique de ces éléments oniriques récurrents. La toile d'araignée, dans laquelle il se sent piégé sans pouvoir s'échapper, en est venue à représenter ses propres attentes internes, souvent irréalistes ou excessivement exigeantes, envers ce que devraient être ses relations sexuelles et intimes. La figure féminine indistincte qui l'observe, quant à elle, a été interprétée comme symbolisant sa peur profonde du jugement de la part de partenaires potentielles, peur qui l'amenait précisément à saboter ces relations avant qu'un tel jugement ne puisse réellement survenir."},
          {q:"Grâce à la technique de la libre association, quelle origine Julien a-t-il découverte à son anxiété relationnelle ?",
           title:"La libre association révèle l'origine",
           text:"À partir des mots « toile », « piège », « regard », Julien découvre une anxiété liée à des parents très critiques et observateurs durant son enfance — reflet d'un conflit entre indépendance et peur d'être jugé.",
           detail:"En utilisant la technique de la libre association à partir des mots-clés issus de son rêve — « toile », « piège », « regard » — Julien a pu progressivement remonter le fil de ses associations d'idées jusqu'à des souvenirs d'enfance jusque-là peu explorés : des parents extrêmement critiques et constamment observateurs de ses moindres faits et gestes, créant chez lui, très tôt, un conflit intérieur profond entre son besoin légitime d'indépendance et une peur intense d'être jugé et évalué négativement. Cette découverte a permis à Julien de faire enfin le lien entre son anxiété relationnelle actuelle et cette empreinte précoce, ouvrant la voie à un travail thérapeutique ciblé sur cette origine identifiée."}

  11: {
    lessons: [
      {
        id:"11-1", title:"Classification & dysfonction érectile",
        cards:[
          {q:"Quels référentiels diagnostiques structurent la classification des troubles sexuels, et que rappelle la citation d'Irvin Yalom ?",
           title:"Des référentiels diagnostiques essentiels",
           text:"« Quand la sexualité devient un problème, il est essentiel de l'aborder avec compassion, compréhension et rigueur scientifique » (Irvin Yalom). Le DSM-5 et la CIM-11 fournissent des critères diagnostiques précis pour catégoriser les troubles sexuels.",
           detail:"La citation d'Irvin Yalom rappelle que l'abord des troubles sexuels doit toujours combiner trois qualités essentielles : la compassion envers la souffrance du patient, la compréhension de sa situation unique, et la rigueur scientifique garantissant un diagnostic fiable. C'est précisément cette rigueur que fournissent le DSM-5 (Manuel diagnostique et statistique des troubles mentaux) et la CIM-11 (Classification internationale des maladies), deux référentiels internationalement reconnus qui offrent des critères diagnostiques précis et validés pour catégoriser rigoureusement les différents troubles sexuels, masculins comme féminins."},
          {q:"En quoi les classifications diagnostiques des troubles sexuels reflètent-elles une approche multifactorielle plutôt qu'isolée ?",
           title:"Une approche multifactorielle",
           text:"Ces classifications reconnaissent que les troubles sexuels sont influencés par des facteurs biologiques, psychologiques, relationnels et sociaux — jamais des phénomènes isolés.",
           detail:"Loin de réduire les troubles sexuels à une cause unique et simpliste, les classifications diagnostiques modernes comme le DSM-5 et la CIM-11 reconnaissent explicitement leur nature multifactorielle : un même trouble, comme la dysfonction érectile, peut résulter de l'interaction complexe entre des facteurs biologiques (hormones, vascularisation), psychologiques (anxiété, traumatismes), relationnels (qualité de la communication de couple) et sociaux (pressions culturelles, normes de performance). Cette reconnaissance multifactorielle invite systématiquement à une évaluation globale du patient plutôt qu'à une recherche hâtive d'une cause unique."},
          {q:"Comment le DSM-5 définit-il précisément la dysfonction érectile (DE) ?",
           title:"La dysfonction érectile (DE) selon le DSM-5",
           text:"Difficulté persistante à obtenir ou maintenir une érection suffisante, ou diminution marquée de la rigidité érectile, lors de l'activité sexuelle.",
           detail:"Le DSM-5 définit la dysfonction érectile comme une difficulté persistante et récurrente, présente lors de la quasi-totalité ou de la totalité des activités sexuelles, à obtenir ou maintenir une érection suffisante pour permettre l'activité sexuelle souhaitée, ou une diminution marquée de la rigidité érectile même lorsqu'une érection partielle est obtenue. Comme pour d'autres troubles sexuels, cette définition insiste sur le caractère persistant et récurrent du problème (excluant les difficultés ponctuelles et isolées), ainsi que sur la nécessité d'une détresse cliniquement significative associée pour poser formellement le diagnostic."},
          {q:"Quelles sont les cinq grandes catégories de causes pouvant expliquer une dysfonction érectile ?",
           title:"Cinq grandes causes de la DE",
           text:"Anomalies vasculaires (athérosclérose), lésions nerveuses (diabète, chirurgie pelvienne), troubles hormonaux (testostérone, thyroïde), facteurs psychologiques (anxiété, traumatismes), troubles structurels (maladie de La Peyronie), effets secondaires médicamenteux (antihypertenseurs).",
           detail:"Les anomalies vasculaires, comme l'athérosclérose, réduisent le flux sanguin nécessaire à l'érection. Les lésions nerveuses, souvent liées au diabète ou à des chirurgies pelviennes, perturbent la transmission des signaux nerveux impliqués. Les troubles hormonaux (déséquilibres de testostérone ou de la thyroïde) affectent directement la fonction sexuelle. Les facteurs psychologiques comme l'anxiété de performance ou des traumatismes non résolus jouent également un rôle majeur. Les troubles structurels, comme la maladie de La Peyronie (courbure anormale du pénis), et enfin les effets secondaires de certains médicaments, notamment les antihypertenseurs, complètent ce tableau multifactoriel des causes possibles."},
          {q:"Quel impact global la dysfonction érectile peut-elle avoir sur la vie psychologique et relationnelle d'un homme ?",

           detail:"Au-delà de sa seule dimension physique, la dysfonction érectile a fréquemment un impact global et profond sur la vie psychologique de l'homme concerné : atteinte de l'estime de soi, altération de l'humeur pouvant aller jusqu'à des états dépressifs, et remise en question douloureuse de sa perception personnelle de la masculinité, souvent culturellement associée à la performance sexuelle. Sur le plan relationnel, ces répercussions psychologiques peuvent créer des tensions de couple, une distance émotionnelle croissante avec le partenaire, et un évitement progressif des situations intimes par peur anticipée de ne pas être à la hauteur, aggravant potentiellement le trouble initial."}

      {

        cards:[
          {q:"Comment le DSM-5 définit-il précisément l'éjaculation précoce, avec quels critères de durée et de fréquence ?",
           title:"Définition de l'éjaculation précoce (DSM-5)",
           text:"Éjaculation survenant lors de la pénétration ou avant, dans environ une minute, de manière persistante depuis au moins 6 mois, causant une détresse marquée ou des difficultés interpersonnelles.",
           detail:"Le DSM-5 définit l'éjaculation précoce comme une éjaculation survenant lors de la pénétration vaginale ou avant celle-ci, dans un délai d'environ une minute, de manière persistante et récurrente depuis au moins six mois. Cette définition précise deux critères temporels stricts (le délai d'une minute et la durée minimale de six mois) permettant de distinguer un trouble clinique établi d'un épisode isolé ou occasionnel. Le diagnostic nécessite également que cette situation entraîne une détresse marquée pour la personne ou des difficultés interpersonnelles significatives avec le ou la partenaire."},
          {q:"Quels facteurs psychologiques et biologiques peuvent contribuer au développement de l'éjaculation précoce ?",
           title:"Facteurs de l'éjaculation précoce",
           text:"Anxiété et stress de performance, troubles de l'image corporelle (psychologiques) ; sensibilité accrue du réflexe éjaculatoire, niveaux anormaux de sérotonine (biologiques).",
           detail:"Sur le plan psychologique, l'anxiété et le stress de performance figurent parmi les facteurs les plus fréquemment identifiés, créant souvent un cercle vicieux où la peur d'éjaculer trop rapidement précipite justement cette éjaculation précoce. Des troubles de l'image corporelle peuvent également contribuer à cette anxiété sous-jacente. Sur le plan biologique, une sensibilité accrue du réflexe éjaculatoire (le seuil de déclenchement étant naturellement plus bas chez certains individus) et des niveaux anormaux de sérotonine, neurotransmetteur impliqué dans la régulation de l'éjaculation, sont également documentés comme facteurs contributifs."},
          {q:"Quels sont les impacts de l'éjaculation précoce, tant pour l'homme concerné que pour son partenaire et sa relation de couple ?",
           title:"Impacts de l'éjaculation précoce",
           text:"Anxiété, dépression, faible estime de soi côté masculin ; frustration et diminution de satisfaction côté partenaire ; risque de conflits, voire de séparation si non traité.",
           detail:"Du côté de l'homme concerné, l'éjaculation précoce non traitée peut générer une anxiété croissante, des états dépressifs, et une érosion progressive de l'estime de soi, particulièrement liée à la dimension de performance souvent associée culturellement à la masculinité. Du côté du partenaire, cette situation peut engendrer frustration et une diminution significative de la satisfaction sexuelle et relationnelle globale. Sans prise en charge appropriée, ces impacts cumulés peuvent conduire à des conflits de couple récurrents, voire, dans les situations les plus sévères et prolongées, à un risque réel de séparation."},
          {q:"Quelles techniques comportementales sont recommandées pour traiter l'éjaculation précoce ?",
           title:"Techniques thérapeutiques pour l'EP",
           text:"La technique du Stop-Start (pause et redémarrage de la stimulation) et la technique du squeeze sont des approches comportementales reconnues et recommandées.",
           detail:"La technique du Stop-Start consiste à interrompre délibérément la stimulation sexuelle dès que la sensation d'éjaculation imminente se fait sentir, puis à la reprendre une fois cette urgence apaisée, répétant ce cycle plusieurs fois avant d'autoriser l'éjaculation, ce qui permet progressivement de mieux reconnaître et maîtriser les signaux précédant l'éjaculation. La technique du squeeze complète cette approche en ajoutant une légère pression manuelle exercée sur le gland ou la base du pénis au moment critique, renforçant encore le contrôle éjaculatoire. Ces deux techniques comportementales, largement documentées et recommandées, sont d'autant plus efficaces lorsqu'elles sont associées à un travail sur l'anxiété de performance sous-jacente."},
          {q:"Qu'est-ce que l'éjaculation retardée (ER), et quelle technique thérapeutique aide spécifiquement à traiter les pensées négatives associées ?",

           text:"Difficulté persistante à atteindre l'éjaculation malgré une stimulation adéquate, souvent liée à des blocages psychologiques profonds ou de l'anxiété. La restructuration cognitive (SCC2) aide à modifier les pensées négatives associées.",
           detail:"L'éjaculation retardée constitue en quelque sorte le trouble inverse de l'éjaculation précoce : elle se caractérise par une difficulté persistante, voire une incapacité, à atteindre l'éjaculation malgré une stimulation sexuelle pourtant adéquate et suffisante. Ce trouble est souvent lié à des blocages psychologiques profonds (culpabilité, conflits internes non résolus) ou à une anxiété spécifique liée à l'acte sexuel lui-même. La technique de restructuration cognitive (SCC2), déjà vue au Module 6, s'avère particulièrement utile pour identifier et modifier les pensées négatives ou les croyances dysfonctionnelles qui alimentent et entretiennent ce trouble spécifique."}

      {

        cards:[
          {q:"Pourquoi le trouble de l'intérêt/excitation sexuelle masculine met-il en lumière la complexité de la sexualité, au-delà de la seule physiologie ?",
           title:"Au-delà de la seule physiologie",
           text:"Le trouble de l'intérêt/excitation sexuelle masculine met en lumière la complexité de la sexualité masculine, qui ne se réduit pas aux seuls mécanismes physiologiques mais englobe la richesse des expériences vécues.",
           detail:"Le trouble de l'intérêt et de l'excitation sexuelle masculine rappelle avec force que la sexualité, même masculine — souvent réduite culturellement à sa seule dimension mécanique et physiologique (l'érection) — ne peut être pleinement comprise sans prendre en compte la richesse des expériences psychologiques, émotionnelles et relationnelles vécues par l'individu. Un homme peut présenter une fonction érectile physiologiquement intacte tout en souffrant d'un manque d'intérêt ou d'excitation sexuelle, révélant l'importance de dimensions bien plus larges que le seul mécanisme corporel dans la compréhension clinique de ce trouble."},
          {q:"Quels facteurs évalue précisément l'Index International de la Fonction Érectile (IIEF) ?",
           title:"L'Index International de la Fonction Érectile (IIEF)",
           text:"Outil de référence structuré autour de plusieurs facteurs, dont la fonction érectile elle-même, le désir sexuel, la satisfaction vis-à-vis du rapport, et la capacité à maintenir une érection après la pénétration.",
           detail:"L'Index International de la Fonction Érectile (IIEF) est un outil d'évaluation standardisé de référence, structuré autour de plusieurs dimensions complémentaires de la fonction sexuelle masculine : la fonction érectile proprement dite (capacité à obtenir une érection), le désir sexuel ressenti, la satisfaction globale vis-à-vis du rapport sexuel vécu, et spécifiquement la capacité à maintenir l'érection après la pénétration jusqu'à la fin du rapport souhaité. Cette évaluation multidimensionnelle permet d'obtenir un tableau clinique bien plus riche et nuancé qu'une simple question sur la présence ou l'absence d'érection."},
          {q:"À quoi sert l'échelle de satisfaction sexuelle (SSS), et en quoi complète-t-elle l'évaluation de la seule performance physique ?",
           title:"L'échelle de satisfaction sexuelle (SSS)",
           text:"Outil principal utilisé pour évaluer la satisfaction sexuelle globale du patient, au-delà de la seule performance physique.",
           detail:"L'échelle de satisfaction sexuelle (SSS) constitue l'outil de référence principal pour évaluer non pas la seule performance physique objective du patient, mais sa satisfaction sexuelle globale et subjective, telle qu'il la vit lui-même. Cette distinction est cliniquement essentielle : un homme peut présenter une fonction érectile physiologiquement excellente tout en éprouvant une insatisfaction sexuelle significative, ou inversement composer avec certaines limitations physiques tout en vivant une sexualité globalement satisfaisante. La SSS permet ainsi de capturer cette dimension subjective, complémentaire mais distincte des seules mesures fonctionnelles objectives comme l'IIEF."},
          {q:"Quel est l'objectif du Journal de Réflexion sur l'Intérêt Sexuel, et quels facteurs cherche-t-il à mettre en évidence ?",
           title:"Le Journal de Réflexion sur l'Intérêt Sexuel",
           text:"Exercice pratique dont l'objectif est d'observer les fluctuations quotidiennes de l'intérêt sexuel et d'en analyser les facteurs influençants (stress, humeur, contexte relationnel).",
           detail:"Le Journal de Réflexion sur l'Intérêt Sexuel est un exercice pratique proposé au patient entre les séances, l'invitant à noter au jour le jour les fluctuations de son intérêt sexuel ressenti. L'objectif dépasse la simple observation descriptive : il s'agit d'analyser conjointement, avec le thérapeute, les facteurs qui semblent influencer ces variations quotidiennes — le niveau de stress ressenti, l'humeur générale, le contexte relationnel du moment (tension ou complicité avec le partenaire). Cette mise en lumière de corrélations, souvent invisibles sans cette démarche d'observation systématique, oriente ensuite précisément le travail thérapeutique vers les facteurs identifiés comme les plus déterminants."},
          {q:"Pourquoi combine-t-on questionnaires standardisés et outils d'auto-observation pour évaluer le trouble de l'intérêt/excitation masculin ?",
           title:"Une évaluation multidimensionnelle",
           text:"Combiner questionnaires standardisés (IIEF, SSS) et outils d'auto-observation (journaux) permet une compréhension fine et personnalisée avant d'orienter le plan thérapeutique.",
           detail:"Les questionnaires standardisés comme l'IIEF ou la SSS offrent l'avantage précieux de la comparabilité et de la validation scientifique, permettant de situer objectivement la situation du patient. Les outils d'auto-observation comme le journal de réflexion, en revanche, capturent une richesse et une personnalisation du vécu quotidien que ne peuvent offrir des questionnaires ponctuels et généraux. En combinant ces deux approches complémentaires, le thérapeute accède à une compréhension à la fois rigoureuse et finement personnalisée de la situation de chaque patient, condition indispensable pour orienter ensuite un plan thérapeutique véritablement adapté à sa réalité spécifique plutôt qu'une approche standardisée et générique."}
        ],
        questions:[

  12: {
    lessons: [
      {
        id:"12-1", title:"Trouble du désir sexuel féminin",
        cards:[
          {q:"Comment le DSM-5 définit-il le « Trouble de l'intérêt/du désir sexuel féminin », et quels critères doivent être réunis pour poser ce diagnostic ?",
           title:"Définition selon le DSM-5",
           text:"Absence ou diminution significative de l'intérêt pour l'activité sexuelle, se manifestant par au moins 3 critères sur 6 (absence d'intérêt, manque de fantasmes, non-initiation, difficultés de plaisir, etc.) pendant au moins 6 mois, avec détresse significative.",
           detail:"Selon le DSM-5, le trouble du désir sexuel féminin est défini sous le terme de « Trouble de l'intérêt/du désir sexuel féminin ». Il se manifeste par au moins trois des critères suivants sur une période d'au moins six mois : absence d'intérêt pour les expériences sexuelles ; manque de pensées ou de fantasmes sexuels ; non-initiation de l'activité sexuelle et non-réceptivité aux propositions du partenaire ; difficultés à éprouver du plaisir pendant l'activité sexuelle dans 75 à 100% des situations ; absence d'intérêt ou de plaisir pour les stimulations sexuelles internes ou externes ; absence de réceptivité au désir sexuel.\n\nLe diagnostic nécessite que les symptômes suscitent une détresse significative. Il est également essentiel de distinguer si le trouble est primaire (persistant depuis les premières expériences), secondaire (acquis après une période normale), situatif (limité à certaines situations ou partenaires), ou généralisé (indépendant du contexte)."},
          {q:"Comment la CIM-11 aborde-t-elle le trouble du désir sexuel féminin, et qu'ajoute-t-elle par rapport au DSM-5 ?",
           title:"L'approche de la CIM-11",
           text:"La CIM-11 intègre ce trouble dans les « troubles de la santé sexuelle », en insistant sur les facteurs physiologiques, psychologiques et interpersonnels, et sur le contexte de vie et la qualité des relations.",
           detail:"La CIM-11 approche le trouble du désir sexuel féminin sous un angle légèrement différent, en l'intégrant dans la catégorie des « troubles de la santé sexuelle ». Elle reconnaît la complexité des facteurs influençant le désir sexuel, y compris les aspects physiologiques, psychologiques et interpersonnels, et met l'accent sur l'importance de considérer le contexte de vie de l'individu et la qualité de ses relations interpersonnelles.\n\nComme le DSM-5, elle exige que les symptômes soient présents depuis plusieurs mois et entraînent une détresse significative ou des difficultés interpersonnelles, et reconnaît les variations entre troubles primaires, secondaires, situationnels et généralisés."},
          {q:"Quelles sont les principales causes sous-jacentes du trouble du désir sexuel féminin, réparties par catégories ?",
           title:"Causes psychologiques, relationnelles et biologiques",
           text:"Psychologiques : stress/anxiété, image corporelle négative. Relationnelles : conflits de couple non résolus, manque de communication. Biologiques : fluctuations hormonales (thyroïde, ménopause, contraceptifs).",
           detail:"Ce trouble, par sa nature multifactorielle, demande une approche holistique. Sur le plan psychologique, le stress et l'anxiété chroniques érodent le désir sexuel en saturant les ressources cognitives ; une image corporelle négative peut engendrer un retrait ou une inhibition du désir.\n\nSur le plan relationnel, les conflits de couple non résolus, le manque de communication et d'intimité émotionnelle peuvent conduire à une diminution du désir. Sur le plan biologique, le rôle des hormones est indéniable : les fluctuations liées à la thyroïde, à la ménopause, ou à l'utilisation de contraceptifs peuvent impacter significativement le désir sexuel."},
          {q:"Quelle est la prévalence estimée du trouble du désir sexuel féminin (TDSF), et quels facteurs l'influencent ?",
           title:"Prévalence du TDSF",
           text:"Le TDSF toucherait entre 10% et 40% des femmes selon les études, avec des variations liées à l'âge (pic après la ménopause), au statut relationnel, à la santé physique/mentale, et aux facteurs socioculturels.",
           detail:"Les estimations de la prévalence du TDSF fluctuent en fonction des critères diagnostiques utilisés, des populations étudiées et des méthodologies de recherche. Les études épidémiologiques suggèrent que le TDSF affecte entre 10% et 40% des femmes.\n\nParmi les facteurs influençant cette prévalence : l'âge et la phase de vie (prévalence accrue chez les femmes ménopausées, en lien avec les changements hormonaux) ; le statut relationnel (conflits de couple, manque de communication) ; la santé physique et mentale (conditions médicales chroniques, dépression, anxiété) ; et les facteurs socioculturels (attitudes envers la sexualité, éducation sexuelle reçue)."},
          {q:"Quelles sont les 5 étapes recommandées pour diagnostiquer le TDSF, et quels outils sont utilisés à chaque étape ?",
           title:"Les 5 étapes du diagnostic",
           text:"1) Entretien clinique initial.\n\n2) Évaluation psychologique (Échelle de Beck, STAI).\n\n3) Évaluation de la dynamique relationnelle (CSI, RSI).\n\n4) Examen médical (bilan hormonal).\n\n5) Échelles spécifiques au désir (FSDS-R, FSFI).",
           detail:"Étape 1 — Entretien clinique initial : établir une relation de confiance et recueillir l'histoire sexuelle, médicale et relationnelle de la patiente.\n\nÉtape 2 — Évaluation psychologique : identifier stress, anxiété, dépression, via l'Échelle de Dépression de Beck ou l'Inventaire d'Anxiété État-Trait (STAI).\n\nÉtape 3 — Évaluation de la dynamique relationnelle : via l'Index de Satisfaction Conjugale (CSI) ou l'Échelle de Satisfaction Relationnelle (RSI).\n\nÉtape 4 — Examen médical : bilan hormonal (testostérone, œstrogènes, prolactine, thyroïde) et recensement des médicaments pris.\n\nÉtape 5 — Échelles spécifiques au désir sexuel : l'Échelle du Désir Sexuel Féminin (FSDS-R) et le Questionnaire sur la Fonction Sexuelle Féminine (FSFI)."}
        ],
        questions:[
          {q:"Selon le DSM-5, combien de critères parmi les six proposés doivent être présents pour diagnostiquer un trouble de l'intérêt/du désir sexuel féminin ?",

           detail:"La douleur génito-pelvienne est localisée dans la partie inférieure de l'abdomen. Elle peut provenir des organes génitaux féminins (col, utérus, ovaires, trompes de Fallope) ou d'autres structures de l'abdomen (intestins, voies urinaires, plancher pelvien). Une douleur qui persiste pendant 3 à 6 mois est considérée comme chronique.\n\nLes troubles gynécologiques peuvent provoquer des douleurs pelviennes cycliques, récurrentes à la même période du cycle menstruel. D'autres pathologies gynécologiques causent des douleurs non liées aux règles. Les troubles non gynécologiques peuvent survenir au niveau de tout système situé dans le bassin, comme le système gastro-intestinal."},

  13: {
    lessons: [
      {
        id:"13-1", title:"Classification des paraphilies & limites de la sexothérapie",
        cards:[
          {q:"Comment définit-on une paraphilie, et quelle est la distinction essentielle entre une paraphilie et un « trouble paraphilique » selon le DSM-5 ?",
           title:"Définir la paraphilie",
           text:"Une paraphilie est une excitation sexuelle obtenue via des fantasmes/comportements/objets s'écartant des normes conventionnelles. Elle devient un trouble paraphilique quand elle cause une détresse significative ou implique un partenaire non consentant.",
           detail:"Les paraphilies sont caractérisées par des expériences sexuelles où l'excitation et la satisfaction sexuelles sont obtenues à travers des fantasmes, des comportements, ou des objets qui s'écartent des normes conventionnelles.\n\nIl est capital de distinguer les paraphilies des troubles paraphiliques. Selon le DSM-5, un trouble paraphilique est diagnostiqué lorsque la paraphilie cause une détresse significative ou une altération du fonctionnement chez l'individu, ou lorsque la satisfaction de la paraphilie implique un autre individu non consentant. Cette distinction souligne l'importance de l'évaluation clinique pour différencier une variabilité sexuelle normale des comportements nécessitant une intervention."},
          {q:"Quelles sont les principales paraphilies couramment reconnues par le DSM-5 et la CIM-11 ?",
           title:"Panorama des paraphilies reconnues",
           text:"Exhibitionnisme, voyeurisme, fétichisme, frotteurisme, masochisme sexuel, sadisme sexuel, addiction sexuelle, transvestisme fétichiste — ainsi que des paraphilies majeures comme la pédophilie et la zoophilie.",
           detail:"Parmi les paraphilies couramment reconnues : l'exhibitionnisme (excitation en s'exposant à des inconnus non consentants) ; le voyeurisme (excitation par l'observation secrète d'autrui) ; le fétichisme (attirance pour des objets non vivants ou une partie du corps non génitale) ; le frotteurisme (plaisir par le frottement contre une personne non consentante) ; le masochisme sexuel (recherche de souffrance ou d'humiliation) ; le sadisme sexuel (excitation par l'infliction de douleur à autrui) ; l'addiction sexuelle (obsession compulsive malgré des conséquences négatives) ; et le transvestisme fétichiste (attraction pour des vêtements du sexe opposé).\n\nCette liste n'est pas exhaustive : on recense aussi des paraphilies majeures comme la pédophilie (attirance pour les enfants prépubères ou péripubères) et des paraphilies non spécifiées comme la zoophilie."},
          {q:"Pourquoi la sexothérapie seule peut-elle être insuffisante pour traiter certaines paraphilies, et quelle approche est alors recommandée ?",
           title:"Les limites de la sexothérapie",
           text:"Certaines paraphilies impliquent des aspects psychopathologiques complexes ou des implications légales dépassant la sexothérapie seule. Une prise en charge multidisciplinaire (psychiatres, psychologues, parfois médication) est alors nécessaire.",
           detail:"Les paraphilies englobent un large éventail de comportements, certains pouvant être considérés comme légalement et éthiquement problématiques, comme l'exhibitionnisme non consenti. La sexothérapie, axée sur la thérapie comportementale, éducative et de communication, peut ne pas être suffisante pour aborder les aspects psychopathologiques complexes ou les implications légales de certains comportements paraphiliques.\n\nSouvent, le traitement bénéficie d'une approche multidisciplinaire incluant la thérapie comportementale, le conseil psychologique, et parfois le traitement médicamenteux. La collaboration avec des psychiatres et des psychologues cliniciens est essentielle pour une prise en charge complète."},
          {q:"Dans quelles situations un sexothérapeute doit-il orienter un client vers un professionnel de la santé mentale ou vers les autorités ?",
           title:"Reconnaître les signaux d'orientation",
           text:"Vers un professionnel : risque de passage à l'acte, comorbidités psychiatriques, détresse psychologique sévère. Vers les autorités : mise en danger de mineurs ou personnes vulnérables, actes criminels révélés.",
           detail:"Trois signaux appellent une orientation vers un professionnel de la santé mentale : le risque de passage à l'acte sur des impulsions paraphiliques pouvant nuire à autrui ; la présence de comorbidités (troubles de l'humeur, de la personnalité, anxieux) ; et une détresse psychologique sévère (pensées suicidaires, dépression profonde).\n\nSur le plan légal et éthique, le sexothérapeute a un devoir légal de référer aux autorités compétentes toute information mettant en danger des mineurs ou des personnes vulnérables. La confidentialité a des limites légales lorsque des informations révèlent des actes criminels ou des risques immédiats pour la sécurité d'autrui."}
        ],
        questions:[

           text:"Impulsions sexuelles intenses et comportements répétitifs difficiles à contrôler, causant détresse. Le DSM-5 ne le reconnaît pas comme trouble distinct ; la CIM-11 le classe comme trouble du contrôle des impulsions.",
           detail:"Le trouble du comportement sexuel compulsif (TCSC) est caractérisé par une expérience persistante d'impulsions sexuelles intenses et de comportements sexuels répétitifs difficiles à contrôler, entraînant une détresse significative ou un dysfonctionnement dans la vie de l'individu.\n\nLe DSM-5 ne reconnaît pas spécifiquement le TCSC comme un trouble distinct, mais inclut une catégorie pour les « Troubles Paraphiliques Non Spécifiés » pouvant englober certains aspects du comportement sexuel compulsif. La CIM-11, en revanche, a classé ce trouble dans la catégorie des troubles du contrôle des impulsions, le caractérisant par un échec persistant du contrôle des impulsions sexuelles intenses aboutissant à un comportement sexuel répétitif, au point de négliger santé, soins personnels ou autres responsabilités."},

           detail:"Le questionnaire PEACCE, version française (traduction par Karila en 2014, d'après le questionnaire PATHOS de Carnes, 2011), est un outil psychométrique concis composé de 6 items dichotomiques (réponses OUI/NON), conçu pour évaluer divers aspects du comportement sexuel problématique : les préoccupations, le sentiment de honte, le fait d'avoir blessé autrui, la recherche d'aide, la perte de contrôle, et la tristesse.\n\nChaque réponse « OUI » vaut 1 point. Un score supérieur ou égal à 3 est indicatif d'une addiction sexuelle. Les comportements associés incluent la recherche de partenaires multiples, la masturbation compulsive, la sexualité en ligne, les relations sexuelles dénuées de sentiment, et l'existence d'une seconde vie sexuelle « cachée »."}

  14: {

      {
        id:"14-1", title:"Fondements psychanalytiques de l'auto-érotisme",
        cards:[
          {q:"Comment Freud conceptualise-t-il l'auto-érotisme dans le développement libidinal, et en quoi ce stade est-il « narcissique » ?",
           title:"L'auto-érotisme selon Freud",
           text:"Freud voit l'auto-érotisme comme un stade primitif où l'excitation sexuelle se résout directement à sa source (un organe), sans objet extérieur. Ce plaisir isolé est narcissique car il ne concerne que le soi.",
           detail:"« L'auto-érotisme représente une étape intermédiaire entre le comportement auto-conservateur et la véritable activité amoureuse dirigée vers un objet extérieur. » — Sigmund Freud.\n\nSelon Freud, l'auto-érotisme marque l'un des stades les plus primitifs du développement libidinal : l'excitation sexuelle peut se résoudre directement à la source de cette excitation, sans qu'il y ait besoin de se tourner vers un objet extérieur. La pulsion sexuelle est encore partiellement développée et indépendante des objets externes ; le plaisir d'organe est la manifestation primaire de la satisfaction libidinale, où la libido est autocentrée. À ce stade, l'individu expérimente le plaisir de manière isolée (par exemple la succion du pouce chez l'enfant), une expérience fondamentalement narcissique car elle ne concerne que le soi et le corps propre."},

          {q:"Comment Freud conceptualise-t-il la libido, et quel rôle joue l'inconscient dans les comportements sexuels selon lui ?",

           text:"Freud voit la libido comme l'énergie psychique principale animant désirs, pulsions et motivations. Il souligne l'importance de l'inconscient, des désirs refoulés et des conflits psychiques dans la vie sexuelle.",
           detail:"Sigmund Freud, pionnier de la psychanalyse, a introduit la notion de libido comme étant le principal moteur du comportement humain, y compris dans le domaine de la sexualité. Selon Freud, la libido représente une énergie psychique qui anime nos désirs, nos pulsions et nos motivations. Il a souligné l'importance de l'inconscient dans la détermination de nos comportements sexuels, mettant en lumière le rôle des désirs refoulés et des conflits psychiques.\n\nFreud a également développé la théorie des stades de développement psychosexuel (vue au Module 3), soulignant l'importance des expériences infantiles dans la formation des préférences sexuelles et des attitudes envers la sexualité à l'âge adulte."},
          {q:"Qu'est-ce que la théorie de « l'armure caractérielle » de Wilhelm Reich, et quelles techniques thérapeutiques en découlent ?",
           title:"Reich et les blocages émotionnels",
           text:"Reich affirme que les tensions physiques et émotionnelles refoulées se manifestent dans le corps sous forme de blocages musculaires et énergétiques (l'armure caractérielle). Il développe la thérapie bioénergétique et la végétothérapie pour les libérer.",
           detail:"Wilhelm Reich, disciple de Freud, a approfondi la compréhension des liens entre les émotions refoulées, les tensions corporelles et les dysfonctions sexuelles. Il a développé la théorie de l'armure caractérielle, affirmant que les tensions physiques et émotionnelles se manifestent dans le corps sous forme de blocages musculaires et énergétiques.\n\nReich a souligné l'importance de la libération de ces blocages pour permettre une expression sexuelle saine et épanouie. Il a développé des techniques thérapeutiques telles que la thérapie bioénergétique et l'approche végétothérapeutique pour aider les individus à dénouer les tensions corporelles et émotionnelles, favorisant ainsi une plus grande satisfaction sexuelle et une meilleure santé globale."},
          {q:"En quoi la conception de la libido par Jung diffère-t-elle de celle de Freud, et quels concepts a-t-il introduits pour décrire les polarités psychiques ?",
           title:"L'approche élargie de Jung",
           text:"Contrairement à Freud, Jung élargit la libido à l'élan vital global (quête d'individuation), au-delà des seules pulsions sexuelles. Il introduit les concepts d'Anima et d'Animus pour décrire les aspects féminins et masculins présents en chacun.",
           detail:"Carl Gustav Jung a élargi le concept de libido pour englober non seulement les pulsions sexuelles, mais aussi l'élan vital qui anime tout être humain dans sa quête d'individuation et d'intégration psychique. Pour Jung, la sexualité ne se limite pas à la satisfaction des désirs physiques, mais est aussi liée à la recherche de la totalité de l'être.\n\nIl a introduit les concepts d'Anima et d'Animus pour décrire les aspects féminins et masculins présents en chacun de nous, indépendamment du genre biologique. Selon Jung, une sexualité épanouie implique l'intégration harmonieuse de ces polarités internes, permettant une expression authentique de soi et une connexion profonde avec les autres. Il a aussi exploré le rôle des archétypes et symboles inconscients influençant nos désirs, fantasmes et choix de partenaires."}

async function loadProgress(){
  try{
    const raw = localStorage.getItem('sexo_progress');
    if(raw){
      const d = JSON.parse(raw);
      state.progress = d.progress || {};
      state.qstats = d.qstats || {};
      state.xp = d.xp || 0;
      state.streak = d.streak || 0;
      state.lastActive = d.lastActive || null;
      state.examHistory = d.examHistory || [];
    }
  }catch(e){ /* pas de données existantes */ }

  // gestion simple du streak
  const today = new Date().toDateString();
  if(state.lastActive !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    if(state.lastActive === y.toDateString()){
      state.streak += 1;
    } else if(state.lastActive){
      state.streak = 1;
    } else {
      state.streak = 1;
    }
    state.lastActive = today;
    await saveProgress();
  }
}

async function saveProgress(){
  try{
    localStorage.setItem('sexo_progress', JSON.stringify({
      progress: state.progress, qstats: state.qstats, xp: state.xp,
      streak: state.streak, lastActive: state.lastActive, examHistory: state.examHistory
    }));
  }catch(e){ console.error('storage error', e); }
}

/* =========================================================
   HELPERS
   ========================================================= */
function totalLessonsInModule(modId){
  const c = CONTENT[modId];
  return c ? c.lessons.length : 0;
}
function doneLessonsInModule(modId){
  const c = CONTENT[modId];
  if(!c) return 0;
  return c.lessons.filter(l => state.progress[l.id]?.done).length;
}
function moduleStatus(modId){
  const c = CONTENT[modId];
  if(!c) return "locked-nocontent"; // pas encore généré
  const done = doneLessonsInModule(modId);
  if(done === c.lessons.length) return "done";
  return "active";
}
function overallModule1Progress(){
  const total = totalLessonsInModule(1);
  const done = doneLessonsInModule(1);
  return total ? Math.round((done/total)*100) : 0;
}
function wrongQuestionsPool(){
  // rassemble les questions marquées comme mal maîtrisées (wrong > right net)
  let pool = [];
  Object.keys(CONTENT).forEach(modId=>{
    CONTENT[modId].lessons.forEach(lesson=>{
      lesson.questions.forEach((q, idx)=>{
        const key = lesson.id+"_"+idx;
        const st = state.qstats[key];
        if(st && st.wrong > 0 && (st.wrong >= (st.right||0))){
          pool.push({...q, lessonId:lesson.id, lessonTitle:lesson.title, qKey:key});
        }
      });
    });
  });
  return pool;
}

// Construit une courte phrase d'aperçu d'une leçon à partir des titres de ses fiches de cours.
function lessonSummaryLine(lesson){
  if(!lesson.cards || lesson.cards.length===0) return "";
  const titles = lesson.cards.map(c=>c.title).slice(0,3);
  return titles.join(' · ');
}

/* === Lecture des fichiers audio originaux de la formation (par module) ===
/* === Lecteur audio persistant des fichiers originaux de la formation (par module) ===
   Hébergés sur CloudFront (CDN), ce qui permet une vraie lecture en flux directe,
   contrairement aux liens Google Drive testés précédemment. */
function formatAudioTime(seconds){
  if(!isFinite(seconds) || seconds<0) seconds = 0;
  const m = Math.floor(seconds/60);
  const s = Math.floor(seconds%60);
  return m + ":" + (s<10?'0':'') + s;
}

function playAudioTrack(url, title, sourceId){
  const audioEl = document.getElementById('module-audio-el');
  const bar = document.getElementById('module-audio-bar');
  if(!url || !audioEl || !bar) return;

  state.currentAudioModuleId = sourceId;
  audioEl.src = url;
  audioEl.playbackRate = state.moduleAudioSpeed || 1;
  bar.style.display = "block";
  bar.classList.remove('mab-error');
  document.getElementById('mab-title-text').textContent = title || "Lecture en cours";
  document.getElementById('mab-playpause-btn').textContent = "⏸️";
  document.getElementById('mab-progress-fill').style.width = "0%";
  document.getElementById('mab-speed-btn').textContent = (state.moduleAudioSpeed || 1) + "×";

  const playPromise = audioEl.play();
  if(playPromise && typeof playPromise.catch === 'function'){
    playPromise.catch(()=>{
      document.getElementById('mab-title-text').textContent = "⚠️ Lecture impossible pour ce fichier";
      bar.classList.add('mab-error');
    });
  }
}

function playModuleAudio(moduleId){
  const url = moduleAudioUrl(moduleId);
  const mod = MODULES.find(m=>m.id===moduleId);
  playAudioTrack(url, mod ? ("Module " + mod.id + " — " + mod.title) : null, "module-"+moduleId);
}

function playMeditationAudio(key){
  const med = MEDITATIONS[key];
  if(!med || !med.audioUrl) return;
  playAudioTrack(med.audioUrl, med.title, "meditation-"+key);
}

const MODULE_AUDIO_SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
function cycleModuleAudioSpeed(){
  const audioEl = document.getElementById('module-audio-el');
  if(!audioEl) return;
  const current = state.moduleAudioSpeed || 1;
  const idx = MODULE_AUDIO_SPEEDS.indexOf(current);
  const next = MODULE_AUDIO_SPEEDS[(idx+1) % MODULE_AUDIO_SPEEDS.length];
  state.moduleAudioSpeed = next;
  audioEl.playbackRate = next;
  document.getElementById('mab-speed-btn').textContent = next + "×";
}

function toggleModuleAudioPlayPause(){
  const audioEl = document.getElementById('module-audio-el');
  if(!audioEl || !audioEl.src) return;
  if(audioEl.paused){
    audioEl.play();
    document.getElementById('mab-playpause-btn').textContent = "⏸️";
  } else {
    audioEl.pause();
    document.getElementById('mab-playpause-btn').textContent = "▶️";
  }
}

function seekModuleAudio(evt){
  const audioEl = document.getElementById('module-audio-el');
  const track = document.getElementById('mab-progress-track');
  if(!audioEl || !audioEl.duration || !track) return;
  const rect = track.getBoundingClientRect();
  const ratio = Math.min(Math.max((evt.clientX - rect.left) / rect.width, 0), 1);
  audioEl.currentTime = ratio * audioEl.duration;
}

function closeModuleAudioBar(){
  const audioEl = document.getElementById('module-audio-el');
  const bar = document.getElementById('module-audio-bar');
  if(audioEl){ audioEl.pause(); audioEl.src = ""; }
  if(bar){ bar.style.display = "none"; bar.classList.remove('mab-error'); }
  state.currentAudioModuleId = null;
}

// Écouteurs sur l'élément audio persistant, initialisés une seule fois au démarrage.
function initModuleAudioListeners(){
  const audioEl = document.getElementById('module-audio-el');
  if(!audioEl) return;
  audioEl.addEventListener('timeupdate', ()=>{
    if(!audioEl.duration) return;
    document.getElementById('mab-progress-fill').style.width = (audioEl.currentTime/audioEl.duration*100) + "%";
    document.getElementById('mab-time-elapsed').textContent = formatAudioTime(audioEl.currentTime);
    document.getElementById('mab-time-remaining').textContent = "-" + formatAudioTime(audioEl.duration - audioEl.currentTime);
  });
  audioEl.addEventListener('ended', ()=>{
    document.getElementById('mab-playpause-btn').textContent = "▶️";
  });
  audioEl.addEventListener('error', ()=>{
    const bar = document.getElementById('module-audio-bar');
    if(bar){
      document.getElementById('mab-title-text').textContent = "⚠️ Lecture impossible pour ce fichier";
      bar.classList.add('mab-error');
    }
  });
}

/* === Synthèse vocale (Web Speech API) === */
function getAudioVoice(){
  const voices = window.speechSynthesis.getVoices();
  if(state.audioSettings.voiceURI){
    const chosen = voices.find(v => v.voiceURI === state.audioSettings.voiceURI);
    if(chosen) return chosen;
  }
  return voices.find(v => v.lang && v.lang.startsWith('fr'));
}

function toggleSpeech(text){
  if(!('speechSynthesis' in window)){
    alert("Désolé, la lecture audio n'est pas prise en charge par ce navigateur.");
    return;
  }
  if(state.speaking){
    window.speechSynthesis.cancel();
    state.speaking = false;
    render();
    return;
  }
  window.speechSynthesis.cancel(); // stoppe toute lecture précédente
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'fr-FR';
  utterance.rate = state.audioSettings.rate;
  const voice = getAudioVoice();
  if(voice) utterance.voice = voice;
  utterance.onend = () => { state.speaking = false; render(); };
  utterance.onerror = () => { state.speaking = false; render(); };
  state.speaking = true;
  window.speechSynthesis.speak(utterance);
  render();
}

function stopSpeech(){
  if('speechSynthesis' in window){

function getNextLesson(currentLessonId){
  const content = CONTENT[state.currentModule];
  const idx = content.lessons.findIndex(l=>l.id===currentLessonId);
  if(idx===-1 || idx+1>=content.lessons.length) return null;
  return content.lessons[idx+1];
}

function toggleLessonAudio(lessonId){
  if(!('speechSynthesis' in window)){
    alert("Désolé, la lecture audio n'est pas prise en charge par ce navigateur.");
    return;
  }
  if(state.autoPlaying){
    stopSpeech();
    render();
    return;
  }
  const content = CONTENT[state.currentModule];
  const lesson = content.lessons.find(l=>l.id===lessonId);
  const cards = lesson.cards || [];
  window.speechSynthesis.cancel();
  state.autoPlaying = true;
  state.speaking = true;
  state.learnDetailOpen = true;
  state.nextLessonSuggestion = null;
  playLessonCard(cards, state.learn.index);
}

function playLessonCard(cards, idx){
  if(idx >= cards.length || !state.autoPlaying){
    const finishedNaturally = idx >= cards.length && state.autoPlaying;
    state.autoPlaying = false;
    state.speaking = false;
    if(finishedNaturally){
      const nextLesson = getNextLesson(state.learn.lessonId);
      if(nextLesson){
        if(state.audioSettings.autoNextLesson){
          startLessonAudioFor(nextLesson.id);
          return;
        } else {
          state.nextLessonSuggestion = nextLesson.id;
        }
      }
    }
    render();
    return;
  }
  state.learn.index = idx;
  render();
  const card = cards[idx];
  const text = card.title + ". " + (card.detail || card.text);
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'fr-FR';
  utterance.rate = state.audioSettings.rate;
  const voice = getAudioVoice();
  if(voice) utterance.voice = voice;
  utterance.onend = () => {
    if(state.autoPlaying) playLessonCard(cards, idx+1);
  };
  utterance.onerror = () => {
    state.autoPlaying = false;
    state.speaking = false;
    render();
  };
  window.speechSynthesis.speak(utterance);
}

}

// Mélange Fisher-Yates : un tirage aléatoire uniforme, sans biais, pour piocher les questions.
function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Mélange l'ordre des options d'une question et remappe correct en conséquence.
function shuffleQuestionOptions(q){
  const n = q.options.length;
  const order = shuffleArray([...Array(n).keys()]); // nouvel ordre : order[newIndex] = oldIndex
  const newOptions = order.map(oldIdx=>q.options[oldIdx]);
  const oldToNew = {};
  order.forEach((oldIdx,newIdx)=>{ oldToNew[oldIdx]=newIdx; });
  const oldCorrect = Array.isArray(q.correct) ? q.correct : [q.correct];
  const newCorrectArr = oldCorrect.map(oldIdx=>oldToNew[oldIdx]).sort((a,b)=>a-b);
  const newCorrect = Array.isArray(q.correct) ? newCorrectArr : newCorrectArr[0];
  return {...q, options:newOptions, correct:newCorrect};
}

        <div class="hi-score ${rec.pct>=70?'pass':'fail'}">${rec.pct}%</div>
        <div class="hi-info">
          <div class="hi-date">${dateStr}</div>
          <div class="hi-sub">${rec.score}/${rec.total} bonnes réponses</div>
        </div>
        <div class="module-chevron">›</div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    ${topbarHTML()}
    <div class="screen">
      <div class="back-row" onclick="openExamenFinalIntro()"><span class="arrow">←</span><span class="label">Retour à l'examen final</span></div>
      <div class="section-label">Historique</div>
      <h2 style="margin:0 0 20px;font-size:20px;">Mes examens passés</h2>
      ${items || '<div class="summary-empty">Aucun examen passé pour l’instant.</div>'}
    </div>
  `;
}

function openExamenFinalReview(idx){
  state.reviewExamIndex = idx;
  state.screen = "examen-final-review";
  render();
}

function renderExamenFinalReview(){
  const rec = state.examHistory[state.reviewExamIndex];
  if(!rec){ goHome(); return; }
  const d = new Date(rec.date);
  const dateStr = d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
  const letters = ["A","B","C","D","E"];

  const questionsHTML = rec.questions.map((q, qi) => {
    const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
    const selectedArr = q.selected || [];
    const wasCorrect = correctArr.length===selectedArr.length && correctArr.every(c=>selectedArr.includes(c));
    const optionsHTML = q.options.map((opt, oi) => {
      let cls = "review-option";
      if(correctArr.includes(oi)) cls += " correct";
      else if(selectedArr.includes(oi)) cls += " incorrect";
      return `
        <div class="${cls}">
          <div class="review-opt-letter">${letters[oi]}</div>
          <div>${opt}</div>
        </div>`;
    }).join('');

    return `
      <div class="review-question-block">
        <div class="review-q-header">
          <span class="review-q-num">Question ${qi+1}</span>
          <span class="review-q-status ${wasCorrect?'ok':'ko'}">${wasCorrect?'✓ Correct':'✗ Incorrect'}</span>
        </div>
        <div class="review-q-text">${q.q}</div>
        <div class="review-options">${optionsHTML}</div>
        ${q.exp ? `<div class="review-exp">${q.exp}</div>` : ''}
      </div>
    `;
  }).join('');

  app.innerHTML = `
    ${topbarHTML()}
    <div class="screen">
      <div class="back-row" onclick="openExamenFinalHistory()"><span class="arrow">←</span><span class="label">Retour à l'historique</span></div>
      <div class="section-label">Correction · ${dateStr}</div>
      <h2 style="margin:0 0 4px;font-size:20px;">Score : ${rec.score}/${rec.total} (${rec.pct}%)</h2>
      <p style="margin:0 0 20px;font-size:13px;color:var(--grey);">Relis chaque question pour comprendre tes erreurs.</p>
      ${questionsHTML}
    </div>
  `;
}

function startExamenFinal(){
  const pool = examenFinalPool();
  if(pool.length===0) return;
  state.caseOpenFor = null;
  const shuffled = shuffleArray(pool).slice(0,28).map(q=>shuffleQuestionOptions(q));
  state.quiz = { questions: shuffled, index:0, selected:null, answered:false, correctCount:0, mode:"examenfinal", answers:new Array(shuffled.length).fill(null) };
  state.screen = "quiz";
  render();
}


function renderQuiz(){
  const qz = state.quiz;
  const q = qz.questions[qz.index];
  const total = qz.questions.length;
  const pct = Math.round((qz.index/total)*100);
  const letters = ["A","B","C","D","E"];
  const isMulti = Array.isArray(q.correct);
  const correctArr = isMulti ? q.correct : [q.correct];
  const selectedArr = qz.selected || [];
  const isExamFinal = qz.mode==='examenfinal';
  const showReveal = qz.answered && !isExamFinal; // pas de révélation immédiate pendant l'examen final

  let optionsHTML = "";
  q.options.forEach((opt,i)=>{
    let cls = "option" + (isMulti ? " option-multi" : "");
    if(showReveal){
      cls += " disabled";
      if(correctArr.includes(i)) cls += " correct";
      else if(selectedArr.includes(i)) cls += " incorrect";
    } else if(selectedArr.includes(i)){
      cls += " selected";
    }
    const marker = isMulti
      ? `<div class="opt-check">${selectedArr.includes(i) || (showReveal && correctArr.includes(i)) ? '✓' : ''}</div>`
      : `<div class="opt-letter">${letters[i]}</div>`;
    optionsHTML += `
      <div class="${cls}" onclick="${(isExamFinal||!qz.answered)?'selectOption('+i+')':''}">
        ${marker}
        <div>${opt}</div>
      </div>`;
  });

  let feedbackHTML = "";
  if(showReveal){
    const ok = arraysMatch(selectedArr, correctArr);
    feedbackHTML = `
      <div class="feedback-panel ${ok?'ok':'ko'}">
        <div class="fb-title ${ok?'ok-t':'ko-t'}">${ok?'✓ Exact !':'✗ Pas tout à fait'}</div>
        <div class="fb-text">${q.exp}</div>
      </div>`;
  }

  let caseHTML = "";
  if(q.caseId && CASE_STUDIES[q.caseId]){
    const cs = CASE_STUDIES[q.caseId];
    const isOpen = state.caseOpenFor === q.caseId;
    caseHTML = `
      <div class="case-toggle" onclick="toggleCase('${q.caseId}')">
        <span>📋 ${isOpen ? 'Masquer' : 'Voir'} le cas pratique</span>
        <span class="case-toggle-chevron">${isOpen ? '−' : '+'}</span>
      </div>
      ${isOpen ? `
      <div class="case-panel">
        <div class="case-panel-title">${cs.title}</div>
        <div class="case-panel-text">${cs.text.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div>
      </div>` : ''}
    `;
  }

  app.innerHTML = `
    <div class="quiz-header">
      <span class="quiz-close" onclick="exitQuiz()">✕</span>
      <div class="quiz-progress"><div class="quiz-progress-fill" style="width:${pct}%"></div></div>
      <span class="quiz-hearts">${qz.index+1}/${total}</span>
    </div>
    <div class="quiz-body">
      <div class="q-kicker">${(qz.mode==='review' ? 'Révision · '+q.lessonTitle : qz.mode==='exam' ? 'Examen blanc · '+q.lessonTitle : qz.mode==='case-exercise' ? '🎯 Entraînement clinique' : isExamFinal ? 'Examen Final' : 'Question')}${isMulti ? ' · Plusieurs réponses possibles' : ''}</div>
      <div class="q-text">${q.q}</div>
      ${caseHTML}
      <div class="options">${optionsHTML}</div>
      ${feedbackHTML}
    </div>
    <div class="quiz-footer">
      ${isExamFinal
        ? `<button class="btn btn-primary" ${selectedArr.length===0?'disabled':''} onclick="validateAnswer()">${qz.index+1===total ? 'Valider et terminer' : 'Valider et continuer'}</button>`
        : showReveal
          ? `<button class="btn btn-primary" onclick="nextQuestion()">${qz.index+1===total ? 'Voir mes résultats' : 'Continuer'}</button>`
          : `<button class="btn btn-primary" ${selectedArr.length===0?'disabled':''} onclick="validateAnswer()">Valider</button>`
      }
    </div>
  `;
}

function arraysMatch(a,b){
  if(a.length!==b.length) return false;
  const sa=[...a].sort(), sb=[...b].sort();
  return sa.every((v,i)=>v===sb[i]);
}

function selectOption(i){
  const qz = state.quiz;
  const q = qz.questions[qz.index];
  const isMulti = Array.isArray(q.correct);
  if(!qz.selected) qz.selected = [];
  if(isMulti){
    const idx = qz.selected.indexOf(i);
    if(idx>-1) qz.selected.splice(idx,1);
    else qz.selected.push(i);
  } else {
    qz.selected = [i];
  }
  render();
}

function validateAnswer(){
  const qz = state.quiz;
  const q = qz.questions[qz.index];
  const correctArr = Array.isArray(q.correct) ? q.correct : [q.correct];
  const ok = arraysMatch(qz.selected || [], correctArr);
  if(ok) qz.correctCount++;

  if(qz.answers){ qz.answers[qz.index] = qz.selected || []; }

  // maj des stats par question (pour la révision espacée simplifiée)
  const key = q.lessonId+"_"+q.qIndex;
  if(!state.qstats[key]) state.qstats[key] = {right:0, wrong:0};
  if(ok){ state.qstats[key].right++; state.xp += 10; }
  else { state.qstats[key].wrong++; }

  saveProgress();

  if(qz.mode==="examenfinal"){
    // pas de révélation immédiate en examen final : on avance directement à la question suivante
    nextQuestion();
    return;
  }

  qz.answered = true;
  render();
}

function toggleCase(caseId){
  state.caseOpenFor = state.caseOpenFor === caseId ? null : caseId;
  render();
}

function nextQuestion(){
  const qz = state.quiz;
  state.caseOpenFor = null;
  if(qz.index+1 < qz.questions.length){
    qz.index++;
    qz.selected = null;
    qz.answered = false;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  const qz = state.quiz;
  if(qz.mode==="lesson"){
    const lessonId = state.currentLesson;
    const score = qz.correctCount+"/"+qz.questions.length;
    state.progress[lessonId] = {done:true, best:score};
    if(qz.correctCount===qz.questions.length) state.xp += 20; // bonus sans-faute
    saveProgress();
  } else if(qz.mode==="exam"){
    const key = "exam-tome-"+qz.examTome;
    const pct = Math.round((qz.correctCount/qz.questions.length)*100);
    const prevBest = state.progress[key]?.bestPct || 0;
    state.progress[key] = {
      done:true,
      best: qz.correctCount+"/"+qz.questions.length+" ("+pct+"%)",
      bestPct: Math.max(prevBest, pct)
    };
    state.xp += 30;
    if(pct===100) state.xp += 50; // bonus sans-faute examen
    saveProgress();
  } else if(qz.mode==="examenfinal"){
    const pct = Math.round((qz.correctCount/qz.questions.length)*100);
    const prevBest = state.progress["examen-final"]?.bestPct || 0;
    state.progress["examen-final"] = {
      done:true,
      best: qz.correctCount+"/"+qz.questions.length+" ("+pct+"%)",
      bestPct: Math.max(prevBest, pct)
    };
    state.xp += 50;
    if(pct===100) state.xp += 100; // bonus sans-faute examen final

    // sauvegarde de l'examen complet pour consultation ultérieure de la correction
    const record = {
      date: Date.now(),
      score: qz.correctCount,
      total: qz.questions.length,
      pct: pct,
      questions: qz.questions.map((q,i)=>({
        q: q.q,
        options: q.options,
        correct: q.correct,
        selected: (qz.answers && qz.answers[i]) || [],
        exp: q.exp,
        lessonTitle: q.lessonTitle,
        moduleTitle: q.moduleTitle
      }))
    };
    state.examHistory.unshift(record);
    if(state.examHistory.length > 15) state.examHistory = state.examHistory.slice(0,15); // limite raisonnable
    state.reviewExamIndex = 0; // le plus récent, pour un accès direct depuis l'écran de résultat

    saveProgress();
  } else if(qz.mode==="case-exercise"){
    if(qz.correctCount===qz.questions.length) state.xp += 15; // petit bonus sans-faute
    saveProgress();
  }
  state.screen = "result";
  render();
}

function exitQuiz(){
  const mode = state.quiz.mode;
  if(mode==="case-exercise"){
    state.screen = "case-library";
  } else if(mode==="review" || mode==="exam" || mode==="examenfinal"){
    state.screen = "home";
  } else {
    state.screen = "module";
  }
  render();
}

function renderResult(){
  const qz = state.quiz;
  const total = qz.questions.length;
  const pct = Math.round((qz.correctCount/total)*100);
  const isExam = qz.mode==="exam" || qz.mode==="examenfinal";
  const passed = pct>=70;
  let emoji = "🌱", title = "Continue comme ça";
  if(pct===100){ emoji="🏆"; title="Sans-faute !"; }
  else if(pct>=80){ emoji="✨"; title="Très solide"; }
  else if(pct>=50){ emoji="👍"; title="Pas mal du tout"; }
  else { emoji="📖"; title="À retravailler"; }

  if(isExam){
    if(passed && pct<80){ emoji="🎓"; title="Examen réussi"; }
    else if(!passed){ emoji="📖"; title="Pas encore acquis"; }
  }

  let subLabel = "Leçon terminée";
  if(qz.mode==='review') subLabel = "Session de révision terminée";
  else if(qz.mode==='exam') subLabel = "Examen blanc terminé — Tome "+qz.examTome;
  else if(qz.mode==='examenfinal') subLabel = "Examen Final Complet terminé";
  else if(qz.mode==='case-exercise') subLabel = "Entraînement clinique terminé";

  app.innerHTML = `
    <div class="result-wrap">
      <div class="result-emoji">${emoji}</div>
      <h2 class="result-title">${title}</h2>
      <div class="result-sub">${subLabel}</div>
      <div class="result-stats">
        <div class="rstat"><div class="n">${qz.correctCount}/${total}</div><div class="l">Score</div></div>
        <div class="rstat"><div class="n">${pct}%</div><div class="l">Réussite</div></div>
      </div>
      ${isExam ? `<div class="exam-threshold-note">${passed ? '✓ Seuil de réussite indicatif (70%) atteint' : 'Seuil de réussite indicatif : 70% — continue à réviser !'}</div>` : ''}
      ${qz.mode==='examenfinal' ? `<button class="btn btn-secondary" style="margin-bottom:10px;" onclick="openExamenFinalReview(0)">📋 Voir la correction</button>` : ''}
      <button class="btn btn-primary" onclick="goHome()">Retour au parcours</button>
    </div>
  `;
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  await loadProgress();
  initModuleAudioListeners();
  state.screen = "home";
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('Service worker non enregistré :', err);
    });
  });
}
</script>
</body>
